  <g transform="translate(770, 648)" filter="url(#shadow)">
    <rect width="160" height="60" rx="10" fill="#3b2e00" stroke="#FECF06" stroke-width="2"/>
    <text x="80" y="22" text-anchor="middle" font-size="11" font-weight="bold" fill="#FECF06">Granite 4.1:8b</text>
    <text x="80" y="38" text-anchor="middle" font-size="9" fill="#00FF41">Inferencia Jurídica</text>
    <text x="80" y="52" text-anchor="middle" font-size="9" fill="#00FF41">T=0.15 · 128K ctx</text>
  </g>

  <!-- NEW label badge -->
  <g transform="translate(882, 410)">
    <rect width="60" height="20" rx="4" fill="#00CFFF" />
    <text x="30" y="14" text-anchor="middle" font-size="9" font-weight="bold" fill="#1a1400">NUEVO V2.1</text>
  </g>

