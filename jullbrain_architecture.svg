  <g transform="translate(50, 88)" filter="url(#shadow)">
    <rect width="210" height="68" rx="8" fill="#3b2e00" stroke="#FECF06" stroke-width="2"/>
    <text x="105" y="26" text-anchor="middle" font-size="11" font-weight="bold" fill="#FECF06">orquestador_JullBrain.bat</text>
    <text x="105" y="42" text-anchor="middle" font-size="9" fill="#00FF41">Bootstrap Entorno Virtual</text>
    <text x="105" y="56" text-anchor="middle" font-size="9" fill="#00FF41">Lanzador Headless Streamlit</text>
  </g>

  <!-- Arrow bat → Streamlit -->
  <path d="M 260 122 L 315 122" fill="none" stroke="#FECF06" stroke-width="2" marker-end="url(#arrowGold)" />

  <!-- 2. Streamlit UI -->
  <g transform="translate(315, 88)" filter="url(#shadow)">
    <rect width="595" height="68" rx="10" fill="#524000" stroke="#00FF41" stroke-width="2"/>
    <text x="298" y="26" text-anchor="middle" font-size="13" font-weight="bold" fill="#FECF06">Panel de Control Visual — app.py (Streamlit)</text>
    <text x="298" y="44" text-anchor="middle" font-size="9" fill="#00FF41">Arquitectura · Conversiones · Integridad · Custodia · Editor RAG</text>
    <text x="298" y="58" text-anchor="middle" font-size="9" fill="#00FF41">🧬 Granite Embedding · Ajustes del Pipeline · Logs en Vivo</text>
  </g>

  <!-- ── Python Environment Boundary ── -->
