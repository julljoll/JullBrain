<desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Diagrama que muestra un cliente en cualquier PC conectando via tunel seguro a JullBrain alojado en una VM Oracle gratuita, que contiene ingesta Docling, base vectorial LanceDB y Granite via Ollama, alimentando un generador de documentos que produce Word o SVG.</desc>
