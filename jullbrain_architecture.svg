  <text x="480" y="782" font-size="11" fill="#FECF06" text-anchor="middle">Jull Ortiz — Arquitecto de Datos con y para la IA Jurídica</text>
  <text x="480" y="798" font-size="9" fill="#00FF41" text-anchor="middle">Propósito: Transformación tecnológica para prevenir corrupción y retardo procesal — Apache 2.0</text>
