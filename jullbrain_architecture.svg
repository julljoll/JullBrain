    <text x="96" y="22" text-anchor="middle" font-size="11" font-weight="bold" fill="#FECF06">Salidas del Pipeline</text>
    <line x1="14" y1="34" x2="178" y2="34" stroke="#524000" />
    <text x="96" y="52" text-anchor="middle" font-size="10" fill="#00FF41">normativas_rag/</text>
    <text x="96" y="66" text-anchor="middle" font-size="9" fill="#FECF06">ley-completa.md</text>
    <line x1="14" y1="80" x2="178" y2="80" stroke="#524000" stroke-dasharray="4,3" />
    <text x="96" y="96" text-anchor="middle" font-size="10" fill="#00FF41">normativas_chunks/</text>
    <text x="96" y="110" text-anchor="middle" font-size="9" fill="#FECF06">hierarchical_chunks.json</text>
  </g>

