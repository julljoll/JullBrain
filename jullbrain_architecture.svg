  <path d="M 614 170 L 614 202" fill="none" stroke="#FECF06" stroke-width="2" marker-end="url(#arrowGold)" />
  <path d="M 598 202 L 598 170" fill="none" stroke="#00FF41" stroke-width="2" marker-end="url(#arrow)" />
  <text x="622" y="190" font-size="8" fill="#FECF06">Lanza</text>
  <text x="518" y="190" font-size="8" fill="#00FF41">Logs / Resultados</text>

  <!-- ── ROW 3: Granite Embedding (NEW) ── -->

  <!-- Arrow chunks.json → Granite Embedder -->
  <path d="M 788 365 L 788 415" fill="none" stroke="#00CFFF" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrowCyan)" />

  <!-- Granite Embedder Box -->
  <g transform="translate(590, 415)" filter="url(#shadow)">
    <rect width="296" height="100" rx="10" fill="#001a26" stroke="#00CFFF" stroke-width="2"/>
    <text x="148" y="22" text-anchor="middle" font-size="13" font-weight="bold" fill="#00CFFF">🧬 granite_embedder.py</text>
    <text x="148" y="38" text-anchor="middle" font-size="9" fill="#00FF41">ibm-granite/granite-embedding-multilingual-r2</text>
    <line x1="14" y1="48" x2="282" y2="48" stroke="#003040" />
    <text x="148" y="64" text-anchor="middle" font-size="9" fill="#00CFFF">768 dimensiones · 32 768 tokens · 200+ idiomas</text>
    <text x="148" y="78" text-anchor="middle" font-size="9" fill="#00FF41">Backend: sentence-transformers · device: cpu</text>
    <text x="148" y="92" text-anchor="middle" font-size="8" fill="#FECF06">Principio R7: espejo documental — no altera chunks</text>
  </g>

  <!-- Arrow Embedder → embedded.json -->
  <path d="M 738 515 L 738 558" fill="none" stroke="#00CFFF" stroke-width="2" marker-end="url(#arrowCyan)" />

