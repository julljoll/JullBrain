    <text x="114" y="22" text-anchor="middle" font-size="12" font-weight="bold" fill="#FECF06">Pipeline de Procesamiento</text>
    <text x="114" y="36" text-anchor="middle" font-size="8" fill="#00FF41">convert_normativas.py</text>
