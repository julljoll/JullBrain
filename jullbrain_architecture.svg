    <text x="155" y="22" text-anchor="middle" font-size="10" font-weight="bold" fill="#FECF06">normativas_rag/ — Markdown Estructurado</text>
    <text x="155" y="38" text-anchor="middle" font-size="9" fill="#00FF41">YAML frontmatter · TOC · Artículos etiquetados</text>
  </g>

