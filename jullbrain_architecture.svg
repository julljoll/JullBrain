<svg width="100%" viewBox="0 0 800 550" xmlns="http://www.w3.org/2000/svg" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <title>JullBrain V2.0 Native Architecture</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#555" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <linearGradient id="envGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D63ED" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#002C66" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#333">JullBrain V2.0 Pipeline Architecture</text>
  <text x="400" y="60" text-anchor="middle" font-size="14" fill="#666">Native Python Automated Legal RAG Pipeline</text>

  <!-- Input Sources -->
  <g transform="translate(100, 100)">
    <rect width="180" height="60" rx="8" fill="#FEE2E2" stroke="#EF4444" stroke-width="2"/>
    <text x="90" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#7F1D1D">normativas_pdf/</text>
    <text x="90" y="48" text-anchor="middle" font-size="12" fill="#991B1B">PDFs, Imágenes</text>
  </g>

  <g transform="translate(520, 100)">
    <rect width="180" height="60" rx="8" fill="#E0E7FF" stroke="#3B82F6" stroke-width="2"/>
    <text x="90" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E3A8A">formatos_word/</text>
    <text x="90" y="48" text-anchor="middle" font-size="12" fill="#1E40AF">.doc, .docx</text>
  </g>

  <!-- Python Environment Background -->
  <rect x="50" y="200" width="700" height="200" rx="15" fill="url(#envGrad)" stroke="#10B981" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="70" y="225" font-size="14" font-weight="bold" fill="#047857">Entorno Virtual (Python 3.10+ Aislado)</text>

  <!-- Processing Modules in Environment -->
  <!-- Docling -->
  <g transform="translate(80, 250)">
    <rect width="140" height="120" rx="8" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
    <text x="70" y="30" text-anchor="middle" font-size="14" font-weight="bold" fill="#92400E">IBM Docling</text>
    <text x="70" y="55" text-anchor="middle" font-size="11" fill="#B45309">OCR &amp; Layout</text>
    <text x="70" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#92400E">Chunker</text>
    <text x="70" y="105" text-anchor="middle" font-size="11" fill="#B45309">JSON Nativo</text>
  </g>

  <line x1="220" y1="310" x2="260" y2="310" marker-end="url(#arrow)" stroke="#555" stroke-width="1.5"/>

  <!-- Legalizer & Metadata -->
  <g transform="translate(260, 250)">
    <rect width="280" height="120" rx="8" fill="#ECFCCB" stroke="#84CC16" stroke-width="2"/>
    <text x="140" y="35" text-anchor="middle" font-size="14" font-weight="bold" fill="#3F6212">Orquestador Python</text>
    <text x="140" y="60" text-anchor="middle" font-size="12" fill="#4D7C0F">legalizer.py (TOC, Artículos)</text>
    <text x="140" y="85" text-anchor="middle" font-size="12" fill="#4D7C0F">metadata_extractor.py (YAML)</text>
    <text x="140" y="110" text-anchor="middle" font-size="12" fill="#4D7C0F">validator.py (Integridad)</text>
  </g>

  <line x1="540" y1="310" x2="580" y2="310" marker-end="url(#arrow)" stroke="#555" stroke-width="1.5"/>

  <!-- Output Generation -->
  <g transform="translate(580, 250)">
    <rect width="140" height="120" rx="8" fill="#F3E8FF" stroke="#A855F7" stroke-width="2"/>
    <text x="70" y="45" text-anchor="middle" font-size="14" font-weight="bold" fill="#581C87">Resultados</text>
    <text x="70" y="70" text-anchor="middle" font-size="12" fill="#6B21A8">.md Files</text>
    <text x="70" y="95" text-anchor="middle" font-size="12" fill="#6B21A8">.json Chunks</text>
  </g>

  <!-- Output Folders -->
  <g transform="translate(150, 460)">
    <rect width="200" height="60" rx="8" fill="#D1FAE5" stroke="#10B981" stroke-width="2"/>
    <text x="100" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#065F46">normativas_rag/</text>
    <text x="100" y="48" text-anchor="middle" font-size="12" fill="#047857">ley_completa.md</text>
  </g>

  <g transform="translate(450, 460)">
    <rect width="200" height="60" rx="8" fill="#CCFBF1" stroke="#14B8A6" stroke-width="2"/>
    <text x="100" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#115E59">normativas_chunks/</text>
    <text x="100" y="48" text-anchor="middle" font-size="12" fill="#0F766E">hierarchical_chunks.json</text>
  </g>

  <!-- Connections -->
  <!-- Inputs to Environment -->
  <path d="M 190 160 C 190 180, 150 180, 150 250" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 610 160 C 610 180, 150 180, 150 250" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Environment to Outputs -->
  <path d="M 650 370 C 650 420, 250 420, 250 460" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 650 370 C 650 420, 550 420, 550 460" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

</svg>