    <text x="148" y="22" text-anchor="middle" font-size="10" font-weight="bold" fill="#00CFFF">hierarchical_chunks_embedded.json</text>
    <text x="148" y="38" text-anchor="middle" font-size="9" fill="#00FF41">campo "embedding": [float × 768] por chunk</text>
  </g>

