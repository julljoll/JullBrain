  <!-- Input Sources -->
  <g transform="translate(75, 240)" filter="url(#shadow)">
    <rect width="155" height="72" rx="8" fill="#3b2e00" stroke="#00FF41" stroke-width="1.5"/>
    <text x="78" y="22" text-anchor="middle" font-size="11" font-weight="bold" fill="#FECF06">Fuentes de Entrada</text>
    <text x="78" y="38" text-anchor="middle" font-size="9" fill="#00FF41">normativas_pdf/</text>
    <text x="78" y="50" text-anchor="middle" font-size="9" fill="#00FF41">PDFs · JPG · TIFF</text>
    <text x="78" y="62" text-anchor="middle" font-size="9" fill="#00FF41">formatos_word/</text>
  </g>

