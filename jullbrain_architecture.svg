    <text x="115" y="26" text-anchor="middle" font-size="13" font-weight="bold" fill="#FECF06">RAGFlow</text>
    <text x="115" y="42" text-anchor="middle" font-size="9" fill="#00FF41">Knowledge Base Vectorial</text>
    <text x="115" y="56" text-anchor="middle" font-size="9" fill="#00FF41">localhost:9380</text>
  </g>

  <!-- Arrow RAGFlow → Granite LLM -->
  <path d="M 710 678 L 770 678" fill="none" stroke="#FECF06" stroke-width="2" marker-end="url(#arrowGold)" />

