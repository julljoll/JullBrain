      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#00FF41" />
    </marker>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#FECF06" />
    </marker>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#00CFFF" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="480" y="38" text-anchor="middle" font-size="20" font-weight="bold" fill="#FECF06">JullBrain V2.1 — Pipeline Architecture</text>
  <text x="480" y="58" text-anchor="middle" font-size="11" fill="#00FF41">IBM Docling + Granite Embedding R2 | Orquestador de Conocimientos Juridicos</text>
  <line x1="60" y1="72" x2="900" y2="72" stroke="#FECF06" stroke-width="2" />

