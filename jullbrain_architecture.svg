<svg width="100%" viewBox="0 0 960 820" xmlns="http://www.w3.org/2000/svg" style="font-family: 'Courier New', Courier, monospace; background-color: #1a1400;">
  <title>JullBrain V2.1 Pipeline Architecture — Granite Embedding R2</title>

  <defs>
