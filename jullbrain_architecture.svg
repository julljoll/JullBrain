    <text x="114" y="62" text-anchor="middle" font-size="10" fill="#00FF41">① legalizer.py — Artículos + TOC</text>
    <text x="114" y="78" text-anchor="middle" font-size="10" fill="#00FF41">② metadata_extractor.py — YAML</text>
    <text x="114" y="94" text-anchor="middle" font-size="10" fill="#00FF41">③ validator.py — Integridad</text>
    <text x="114" y="112" text-anchor="middle" font-size="8" fill="#FECF06">Doble Validación Cruzada (R7)</text>
  </g>

