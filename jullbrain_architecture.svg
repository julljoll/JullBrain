    <text x="69" y="22" text-anchor="middle" font-size="12" font-weight="bold" fill="#FECF06">IBM Docling</text>
    <text x="69" y="38" text-anchor="middle" font-size="9" fill="#00FF41">OCR + Layout</text>
    <text x="69" y="52" text-anchor="middle" font-size="9" fill="#00FF41">Extracción JSON</text>
    <line x1="14" y1="64" x2="124" y2="64" stroke="#524000" />
