# ==============================================================================
# JullBrain v0.2.0 — Orquestación Nativa Podman (Windows & Linux Rootless)
# Uso: podman compose -f podman-compose.yml up -d --build
# ==============================================================================
version: "3.9"

services:
  jullbrain-core:
    build:
      context: .
      dockerfile: Containerfile
    image: localhost/jullbrain-ibm:0.2.0
    container_name: jullbrain-core
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "8080:8080"
    environment:
      - JULLBRAIN_ENV=podman
      - JULLBRAIN_PORT=8080
      - JULLBRAIN_MODEL_VAULT=/app/RAG/modelos_ia
      - DOCLING_ARTIFACTS_PATH=/app/RAG/modelos_ia/docling
      - HF_HOME=/app/RAG/modelos_ia/huggingface
      - TORCH_HOME=/app/RAG/modelos_ia/torch
      - OLLAMA_HOST=http://jullbrain-ollama:11434
      - HF_HUB_DISABLE_TELEMETRY=1
      - DO_NOT_TRACK=1
    volumes:
      - ./RAG:/app/RAG:Z
      - ./logs:/app/logs:Z
    depends_on:
      - jullbrain-ollama
    networks:
      - jullbrain_enclave

  jullbrain-ollama:
    image: docker.io/ollama/ollama:latest
    container_name: jullbrain-ollama
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_MODELS=/models/ollama
    volumes:
      - ./RAG/modelos_ia/ollama:/models/ollama:Z
    networks:
      - jullbrain_enclave

networks:
  jullbrain_enclave:
    driver: bridge
