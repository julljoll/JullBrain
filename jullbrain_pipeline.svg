<svg width="100%" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <title>JullBrain V2.0 Recursive Pipeline Process</title>
  <defs>
    <marker id="arrowHead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#555" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#333">JullBrain V2.0 Recursive Processing</text>
  <text x="400" y="60" text-anchor="middle" font-size="14" fill="#666">Directory Structure Preservation in Output</text>

  <!-- Input Structure -->
  <g transform="translate(50, 100)">
    <rect width="200" height="400" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
    <text x="100" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#334155">Input: normativas_pdf/</text>
    
    <!-- Folders -->
    <text x="20" y="70" font-size="14" font-weight="bold" fill="#0F172A">📂 civil/</text>
    <text x="40" y="95" font-size="13" fill="#475569">📄 cod_civil.pdf</text>
    <text x="40" y="120" font-size="13" fill="#475569">📄 reg_inm.pdf</text>

    <text x="20" y="160" font-size="14" font-weight="bold" fill="#0F172A">📂 penal/</text>
    <text x="40" y="185" font-size="13" fill="#475569">📄 cod_penal.pdf</text>
    <text x="40" y="210" font-size="13" fill="#475569">📄 ley_delitos.pdf</text>

    <text x="20" y="250" font-size="14" font-weight="bold" fill="#0F172A">📂 laboral/</text>
    <text x="40" y="275" font-size="14" font-weight="bold" fill="#0F172A">📂 2026/</text>
    <text x="60" y="300" font-size="13" fill="#475569">📄 decreto_salario.pdf</text>
  </g>

  <!-- Process Node -->
  <g transform="translate(300, 250)">
    <rect width="200" height="100" rx="12" fill="#E0F2FE" stroke="#0284C7" stroke-width="2"/>
    <text x="100" y="45" text-anchor="middle" font-size="16" font-weight="bold" fill="#0369A1">JullBrain V2.0 Pipeline</text>
    <text x="100" y="65" text-anchor="middle" font-size="12" fill="#0C4A6E">(Native Python Env)</text>
    <text x="100" y="85" text-anchor="middle" font-size="11" fill="#0C4A6E">Recursive Path Walking</text>
  </g>

  <!-- Output Structure -->
  <g transform="translate(550, 100)">
    <rect width="200" height="400" rx="8" fill="#F0FDF4" stroke="#86EFAC" stroke-width="2"/>
    <text x="100" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#14532D">Output: normativas_rag/</text>
    
    <!-- Folders -->
    <text x="20" y="70" font-size="14" font-weight="bold" fill="#14532D">📂 civil/</text>
    <text x="40" y="95" font-size="13" fill="#15803D">📄 cod_civil.md</text>
    <text x="40" y="120" font-size="13" fill="#15803D">📄 reg_inm.md</text>

    <text x="20" y="160" font-size="14" font-weight="bold" fill="#14532D">📂 penal/</text>
    <text x="40" y="185" font-size="13" fill="#15803D">📄 cod_penal.md</text>
    <text x="40" y="210" font-size="13" fill="#15803D">📄 ley_delitos.md</text>

    <text x="20" y="250" font-size="14" font-weight="bold" fill="#14532D">📂 laboral/</text>
    <text x="40" y="275" font-size="14" font-weight="bold" fill="#14532D">📂 2026/</text>
    <text x="60" y="300" font-size="13" fill="#15803D">📄 decreto_salario.md</text>

    <text x="100" y="360" text-anchor="middle" font-size="13" fill="#14532D">...and normativas_chunks/</text>
  </g>

  <!-- Arrows -->
  <path d="M 250 300 L 300 300" fill="none" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrowHead)"/>
  <path d="M 500 300 L 550 300" fill="none" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrowHead)"/>

</svg>
