name: 🔬 JullBrain — QA Suite & Offline Integrity (IBM Stack)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 8 * * 1'

jobs:
  offline-qa-tests:
    name: 🧪 Ejecución de Tests QA & Forensic (Python 3.12 - 3.14)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout del repositorio
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: 📦 Instalar dependencias para pruebas
        run: |
          pip install --upgrade pip
          pip install PyMuPDF pypdf PyYAML rich psutil pydantic fastapi httpx

      - name: 🔐 Validar Encabezado Canónico (.bat)
        run: |
          python Idea-Principal/parser_header_canonico.py orquestador_JullBrain.bat
          python Idea-Principal/parser_header_canonico.py Idea-Principal/header_canonico.bat

      - name: 🧪 Ejecución de Suite de Pruebas Unitarias y Forenses
        run: |
          python -m unittest discover tests
