  <!-- LEYENDA EXPLICATIVA DE TAREAS V3.0 -->
  <g transform="translate(40, 790)" filter="url(#shadow)">
    <rect width="1840" height="225" rx="14" fill="#0d111a" stroke="#253246" stroke-width="1.5"/>
    <text x="70" y="820" font-size="14" font-weight="bold" fill="#FECF06">📋 LEYENDA TÉCNICA DE TAREAS Y FLUJO DE DATOS — VISIÓN GENERAL V3.0</text>
    <line x1="70" y1="830" x2="1810" y2="830" stroke="#253246" />

    <!-- Columna 1 -->
    <g transform="translate(70, 845)">
      <text x="0" y="15" font-size="11" font-weight="bold" fill="#00FF41">Tarea 1 — Control Dual &amp; FastAPI:</text>
      <text x="0" y="32" font-size="10" fill="#a0aec0">`orquestador_JullBrain.bat` activa el entorno nativo `docling_env` y levanta `app.py` (FastAPI) en puerto 8050.</text>
      <text x="0" y="48" font-size="10" fill="#a0aec0">Permite sincronización bidireccional continua con Google Colab GPU (T4/A100) vía GitHub Actions CI/CD.</text>

      <text x="0" y="75" font-size="11" font-weight="bold" fill="#00FF41">Tarea 2 — Ingesta &amp; Chunking Estructural:</text>
      <text x="0" y="92" font-size="10" fill="#a0aec0">IBM Docling recibe PDFs/Word, aplica OCR (EasyOCR/Tesseract) y ejecuta `HierarchicalChunker` para emitir JSON.</text>
      <text x="0" y="108" font-size="10" fill="#a0aec0">Verifica hashes SHA-256 en `.conversion_cache/manifest.json` para omitir archivos sin modificaciones.</text>
    </g>

    <!-- Columna 2 -->
    <g transform="translate(950, 845)">
      <text x="0" y="15" font-size="11" font-weight="bold" fill="#00FF41">Tarea 3 — Parsing Jurídico &amp; Doble Validación:</text>
      <text x="0" y="32" font-size="10" fill="#a0aec0">`legalizer.py` detecta TÍTULO/CAPÍTULO/Artículo; `metadata_extractor.py` agrega el frontmatter YAML y hash.</text>
      <text x="0" y="48" font-size="10" fill="#a0aec0">`validator.py` ejecuta el Principio 10 (Doble validación cruzada Regex vs PyMuPDF) garantizando Error Cero.</text>

      <text x="0" y="75" font-size="11" font-weight="bold" fill="#00FF41">Tarea 4 &amp; 5 — Embeddings, Guardrails &amp; Inferencia LLM:</text>
      <text x="0" y="92" font-size="10" fill="#a0aec0">`granite_embedder.py` (Granite Multilingual R2) inyecta vector 768-d; OpenSearch aplica búsqueda híbrida BM25+Dense+RRF.</text>
      <text x="0" y="108" font-size="10" fill="#a0aec0">Granite Guardian filtra prompts/salidas e IBM Granite 3.3 8B genera respuestas fundamentadas con abstención obligatoria.</text>
    </g>
  </g>

  <!-- FOOTER BAR -->
  <text x="960" y="1055" text-anchor="middle" font-size="11" fill="#a0aec0">JullBrain Legal-RAG Architecture Spec V3.0 | Diseñado por Jull Ortiz | Licencia Apache 2.0 | Air-Gapped &amp; Colab Dual Architecture</text>
