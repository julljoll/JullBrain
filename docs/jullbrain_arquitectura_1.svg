    <text x="35" y="160" font-size="9" fill="#00FF41">• Tabla de Contenido (TOC MD)</text>

    <rect x="20" y="215" width="280" height="130" rx="8" fill="#09101a" stroke="#FECF06" stroke-width="1"/>
    <text x="35" y="240" font-size="11" font-weight="bold" fill="#00FF41">② metadata_extractor.py</text>
    <text x="35" y="260" font-size="10" fill="#FECF06">Inyección de Frontmatter YAML:</text>
    <text x="35" y="278" font-size="9" fill="#a0aec0">• Gaceta Oficial, Fecha, Título</text>
    <text x="35" y="294" font-size="9" fill="#a0aec0">• Hash Criptográfico SHA-256</text>
    <text x="35" y="310" font-size="9" fill="#00FF41">• Metadata para Filtros RAG</text>

    <rect x="20" y="355" width="280" height="165" rx="8" fill="#09101a" stroke="#FF4B4B" stroke-width="1.5"/>
    <text x="35" y="380" font-size="11" font-weight="bold" fill="#FF4B4B">③ validator.py (Principio 10)</text>
    <text x="35" y="400" font-size="10" fill="#FECF06">Doble Validación Cruzada:</text>
    <text x="35" y="420" font-size="9" fill="#a0aec0">• Conteo Regex en Markdown</text>
    <text x="35" y="436" font-size="9" fill="#a0aec0">VS Extracción directa PyMuPDF</text>
    <text x="35" y="456" font-size="9" fill="#00FF41">• Reporte de Integridad Error Cero</text>
    <text x="35" y="472" font-size="9" fill="#00FF41">• Detección de saltos/duplicados</text>
  </g>

