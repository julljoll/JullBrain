    <text x="35" y="436" font-size="8.5" fill="#00FF41">• Ventana de Contexto: 128,000 tks</text>
    <text x="35" y="452" font-size="8.5" fill="#FF4B4B">• Abstención Obligatoria (Principio 5)</text>
    <text x="35" y="468" font-size="8.5" fill="#00CFFF">• Semáforo: 🟢 Anclado / 🟡 Rev / 🔴 Des</text>
