    <text x="35" y="88" font-size="11" font-weight="bold" fill="#00CFFF">granite_embedder.py</text>
    <text x="35" y="106" font-size="9" fill="#00FF41">Motor Embeddings Granite R2:</text>
    <text x="35" y="122" font-size="8.5" fill="#a0aec0">• ibm-granite/multilingual-r2 (768-d)</text>
    <text x="35" y="138" font-size="8.5" fill="#a0aec0">• Ventana Contexto: 32,768 tokens</text>
    <text x="35" y="154" font-size="8.5" fill="#FECF06">• Backend: sentence-transformers / Ollama</text>
    <line x1="35" y1="168" x2="285" y2="168" stroke="#253246" />
    <text x="35" y="186" font-size="10.5" font-weight="bold" fill="#FECF06">opensearch_indexer.py:</text>
    <text x="35" y="202" font-size="8.5" fill="#00FF41">• BM25Okapi + Dense 768-d + RRF</text>
    <text x="35" y="218" font-size="8.5" fill="#a0aec0">• LightRAG Knowledge Graph Dual-Level</text>
    <text x="35" y="234" font-size="8" fill="#00CFFF">Espejo Documental Forense R7</text>

    <rect x="20" y="310" width="280" height="210" rx="8" fill="#09101a" stroke="#FECF06" stroke-width="1"/>
    <text x="35" y="332" font-size="11" font-weight="bold" fill="#FECF06">📜 Cadena de Custodia ISO &amp; Audit</text>
    <text x="35" y="352" font-size="8.5" fill="#00FF41">• ISO/IEC 27037 &amp; 27042 Evidencia</text>
    <text x="35" y="368" font-size="8.5" fill="#00FF41">• audit_logger.py ➔ audit_trail.jsonl</text>
    <text x="35" y="384" font-size="8.5" fill="#00FF41">• Firma SHA-256 inmutable por evento</text>
    <text x="35" y="400" font-size="8.5" fill="#a0aec0">• Validez probatoria ante tribunales</text>
    <text x="35" y="416" font-size="8.5" fill="#a0aec0">• Detección de anomalías de foliatura</text>
    <text x="35" y="432" font-size="8.5" fill="#FECF06">• Semáforo de Integridad Forense</text>
  </g>

