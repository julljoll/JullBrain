<svg width="100%" height="100%" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" style="font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: #080b12;">
  <title>JullBrain — Formato 1: Encuesta de Friqui y Dolor Operativo (Design Thinking / Empatizar)</title>

  <defs>
    <linearGradient id="gradHeader" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="gradCardDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <linearGradient id="gradBoxBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#072738" />
      <stop offset="100%" stop-color="#04141e" />
    </linearGradient>

    <linearGradient id="gradBoxGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#332505" />
      <stop offset="100%" stop-color="#1a1202" />
    </linearGradient>

    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- HEADER BANNER -->
  <rect x="0" y="0" width="1920" height="90" fill="url(#gradHeader)" />
  <line x1="0" y1="90" x2="1920" y2="90" stroke="#334155" stroke-width="2" />

  <!-- Badge DT Stage -->
  <rect x="40" y="18" width="220" height="54" rx="8" fill="#0f62fe" filter="url(#shadow)" />
  <text x="52" y="40" fill="#FFFFFF" font-size="12" font-weight="900" letter-spacing="1">TÉCNICA 1: ENCUESTA</text>
  <text x="52" y="58" fill="#93c5fd" font-size="12" font-weight="700">EMPATIZAR &amp; COMPRENDER</text>

  <!-- Title -->
  <text x="280" y="40" fill="#F8FAFC" font-size="20" font-weight="800">CUESTIONARIO DE DIAGNÓSTICO DE FRICCIÓN Y CARGA PROCESAL (COPP ART. 309)</text>
  <text x="280" y="62" fill="#94A3B8" font-size="13" font-weight="500">Instrumento de recolección de datos cuantitativos y cualitativos para validar necesidades del operador de justicia en la Audiencia Preliminar</text>

  <!-- Profile metadata header box -->
  <g transform="translate(1360, 16)">
    <rect x="0" y="0" width="520" height="58" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <text x="16" y="24" fill="#38bdf8" font-size="11" font-weight="800">PERFIL DEL ENCUESTADO:</text>
    <text x="16" y="44" fill="#CBD5E1" font-size="10">[  ] Juez de Control   [  ] Fiscal MP   [  ] Defensor Público   [  ] Secretario</text>
    <text x="360" y="24" fill="#94A3B8" font-size="10">Circuito Penal: _________</text>
    <text x="360" y="44" fill="#94A3B8" font-size="10">Fecha: ____/____/2026</text>
  </g>

  <!-- SECTION 1: VALORACIÓN DE CARGA PROCESAL Y TIEMPOS (LIKERT SCALES) -->
  <text x="40" y="122" fill="#38BDF8" font-size="13" font-weight="800" letter-spacing="1">SECCIÓN A: ESCALA DE LIKERT — EVALUACIÓN DE FRICCIÓN OPERATIVA Y RETARDO PROCESAL</text>

  <g transform="translate(40, 138)">
    <rect x="0" y="0" width="1840" height="310" rx="12" fill="url(#gradBoxBlue)" stroke="#00CFFF" stroke-width="1.5" filter="url(#shadow)" />
    
    <!-- Scale Legend Header -->
    <rect x="0" y="0" width="1840" height="36" rx="12" fill="#00CFFF" opacity="0.2" />
    <text x="20" y="23" fill="#38BDF8" font-size="12" font-weight="800">PREGUNTAS DE DIAGNÓSTICO (Marque del 1 al 5 donde 1 = Muy Bajo / Nunca y 5 = Muy Alto / Siempre)</text>

    <!-- Header columns -->
    <text x="1250" y="23" fill="#93C5FD" font-size="11" font-weight="800" text-anchor="middle">1 (Muy Bajo)</text>
    <text x="1370" y="23" fill="#93C5FD" font-size="11" font-weight="800" text-anchor="middle">2 (Bajo)</text>
    <text x="1490" y="23" fill="#93C5FD" font-size="11" font-weight="800" text-anchor="middle">3 (Moderado)</text>
    <text x="1610" y="23" fill="#93C5FD" font-size="11" font-weight="800" text-anchor="middle">4 (Alto)</text>
    <text x="1730" y="23" fill="#93C5FD" font-size="11" font-weight="800" text-anchor="middle">5 (Muy Alto)</text>

    <!-- Row 1 -->
    <g transform="translate(20, 52)">
      <text x="0" y="20" fill="#FFFFFF" font-size="11" font-weight="700">1. Tiempo y esfuerzo mental dedicado a la lectura e inspección manual del expediente (&gt;100 folios) antes de la audiencia:</text>
      <text x="0" y="38" fill="#94A3B8" font-size="10">¿Qué tan agotadora e ineficiente considera la revisión física hoja por hoja para ubicar actas, peritajes o notificaciones clave?</text>
      
      <circle cx="1230" cy="24" r="14" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/><text x="1230" y="28" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">1</text>
      <circle cx="1350" cy="24" r="14" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/><text x="1350" y="28" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">2</text>
      <circle cx="1470" cy="24" r="14" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/><text x="1470" y="28" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">3</text>
      <circle cx="1590" cy="24" r="14" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/><text x="1590" y="28" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">4</text>
      <circle cx="1710" cy="24" r="14" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/><text x="1710" y="28" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">5</text>
      <line x1="0" y1="52" x2="1800" y2="52" stroke="#1e293b" />
    </g>

    <!-- Row 2 -->
    <g transform="translate(20, 114)">
      <text x="0" y="20" fill="#FFFFFF" font-size="11" font-weight="700">2. Frecuencia de diferimiento de Audiencias Preliminares por fallas formales o carpetas mal foliadas:</text>
      <text x="0" y="38" fill="#94A3B8" font-size="10">¿Con qué frecuencia se suspende la audiencia debido a saltos de folio, falta de boletas o notificaciones no cosidas a tiempo?</text>

      <circle cx="1230" cy="24" r="14" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/><text x="1230" y="28" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">1</text>
      <circle cx="1350" cy="24" r="14" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/><text x="1350" y="28" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">2</text>
      <circle cx="1470" cy="24" r="14" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/><text x="1470" y="28" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">3</text>
      <circle cx="1590" cy="24" r="14" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/><text x="1590" y="28" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">4</text>
      <circle cx="1710" cy="24" r="14" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/><text x="1710" y="28" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">5</text>
      <line x1="0" y1="52" x2="1800" y2="52" stroke="#1e293b" />
    </g>

    <!-- Row 3 -->
    <g transform="translate(20, 176)">
      <text x="0" y="20" fill="#FFFFFF" font-size="11" font-weight="700">3. Fricción al calcular manualmente la reducción de penas por Admisión de Hechos (Art. 375 COPP):</text>
      <text x="0" y="38" fill="#94A3B8" font-size="10">¿Qué tan complejo o susceptible a dudas resulta el cómputo en vivo de penas originarias vs rebajadas y medidas cautelares?</text>

      <circle cx="1230" cy="24" r="14" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/><text x="1230" y="28" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">1</text>
      <circle cx="1350" cy="24" r="14" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/><text x="1350" y="28" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">2</text>
      <circle cx="1470" cy="24" r="14" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/><text x="1470" y="28" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">3</text>
      <circle cx="1590" cy="24" r="14" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/><text x="1590" y="28" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">4</text>
      <circle cx="1710" cy="24" r="14" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/><text x="1710" y="28" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">5</text>
      <line x1="0" y1="52" x2="1800" y2="52" stroke="#1e293b" />
    </g>

    <!-- Row 4 -->
    <g transform="translate(20, 238)">
      <text x="0" y="20" fill="#FFFFFF" font-size="11" font-weight="700">4. Necesidad de contar con una herramienta que verifique la licitud probatoria (Art. 49 CRBV) e integridad antes del debate:</text>
      <text x="0" y="38" fill="#94A3B8" font-size="10">¿Qué tan útil considera disponer de un reporte automatizado que alerte sobre nulidades formales o causales de sobreseimiento?</text>

      <circle cx="1230" cy="24" r="14" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/><text x="1230" y="28" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">1</text>
      <circle cx="1350" cy="24" r="14" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/><text x="1350" y="28" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">2</text>
      <circle cx="1470" cy="24" r="14" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/><text x="1470" y="28" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">3</text>
      <circle cx="1590" cy="24" r="14" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/><text x="1590" y="28" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">4</text>
      <circle cx="1710" cy="24" r="14" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/><text x="1710" y="28" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">5</text>
    </g>
  </g>


  <!-- SECTION 2: PRIORIZACIÓN DE PUNTOS DE DOLOR (RANKING) -->
  <text x="40" y="478" fill="#38BDF8" font-size="13" font-weight="800" letter-spacing="1">SECCIÓN B: MATRIZ DE PRIORIZACIÓN DE DOLORES DE USUARIO (Ordene del 1 al 4 según impacto negativo)</text>

  <g transform="translate(40, 492)">
    <rect x="0" y="0" width="1840" height="215" rx="12" fill="url(#gradBoxGold)" stroke="#FECF06" stroke-width="1.5" filter="url(#shadow)" />
    <rect x="0" y="0" width="1840" height="34" rx="12" fill="#FECF06" opacity="0.2" />
    <text x="20" y="22" fill="#FDE047" font-size="12" font-weight="800">¿CUÁL DE ESTOS FACTORES GENERA MAYOR RETARDO PROCESAL EN SU DÍA A DÍA? (Asigne 1 al más crítico, 4 al menos crítico)</text>

    <!-- Option A -->
    <g transform="translate(20, 48)">
      <rect x="0" y="0" width="430" height="145" rx="8" fill="#1e1202" stroke="#713f12" stroke-width="1" />
      <rect x="15" y="15" width="28" height="28" rx="4" fill="#0f172a" stroke="#fde047" stroke-width="1.5" />
      <text x="29" y="34" fill="#fde047" font-size="14" font-weight="900" text-anchor="middle">[  ]</text>
      <text x="54" y="32" fill="#FEF08A" font-size="11" font-weight="800">DOLOR A: VICIOS DE FOLIATURA</text>
      <text x="15" y="58" fill="#CBD5E1" font-size="9.5">• Expedientes físicos desorganizados o cosidos con errores.</text>
      <text x="15" y="74" fill="#CBD5E1" font-size="9.5">• Pérdida de notificaciones o boletas de traslado no anexadas.</text>
      <text x="15" y="90" fill="#CBD5E1" font-size="9.5">• Causa principal de suspensión el mismo día de la cita.</text>
      <text x="15" y="118" fill="#FDE047" font-size="9.5" font-weight="700">Impacto: Pérdida del día de despacho y retardo acumulado.</text>
    </g>

    <!-- Option B -->
    <g transform="translate(475, 48)">
      <rect x="0" y="0" width="430" height="145" rx="8" fill="#1e1202" stroke="#713f12" stroke-width="1" />
      <rect x="15" y="15" width="28" height="28" rx="4" fill="#0f172a" stroke="#fde047" stroke-width="1.5" />
      <text x="29" y="34" fill="#fde047" font-size="14" font-weight="900" text-anchor="middle">[  ]</text>
      <text x="54" y="32" fill="#FEF08A" font-size="11" font-weight="800">DOLOR B: ADMISIBILIDAD PROBATORIA</text>
      <text x="15" y="58" fill="#CBD5E1" font-size="9.5">• Debate largo e improvisado sobre pertinencia de pruebas.</text>
      <text x="15" y="74" fill="#CBD5E1" font-size="9.5">• Falta de clasificación previa de la evidencia del MP y Defensa.</text>
      <text x="15" y="90" fill="#CBD5E1" font-size="9.5">• Dificultad para contrastar peritajes técnicos al momento.</text>
      <text x="15" y="118" fill="#FDE047" font-size="9.5" font-weight="700">Impacto: Audiencias preliminares de 3 a 5 horas de duración.</text>
    </g>

    <!-- Option C -->
    <g transform="translate(930, 48)">
      <rect x="0" y="0" width="430" height="145" rx="8" fill="#1e1202" stroke="#713f12" stroke-width="1" />
      <rect x="15" y="15" width="28" height="28" rx="4" fill="#0f172a" stroke="#fde047" stroke-width="1.5" />
      <text x="29" y="34" fill="#fde047" font-size="14" font-weight="900" text-anchor="middle">[  ]</text>
      <text x="54" y="32" fill="#FEF08A" font-size="11" font-weight="800">DOLOR C: CÓMPUTO DE PENAS MANUAL</text>
      <text x="15" y="58" fill="#CBD5E1" font-size="9.5">• Cálculo complejo de tercios, rebajas y causales de atenuación.</text>
      <text x="15" y="74" fill="#CBD5E1" font-size="9.5">• Inseguridad al proponer fórmulas de pena en Admisión (Art. 375).</text>
      <text x="15" y="90" fill="#CBD5E1" font-size="9.5">• Temor a cometer errores de cómputo sancionables.</text>
      <text x="15" y="118" fill="#FDE047" font-size="9.5" font-weight="700">Impacto: Rechazo o desuso del procedimiento especial acelerado.</text>
    </g>

    <!-- Option D -->
    <g transform="translate(1385, 48)">
      <rect x="0" y="0" width="435" height="145" rx="8" fill="#1e1202" stroke="#713f12" stroke-width="1" />
      <rect x="15" y="15" width="28" height="28" rx="4" fill="#0f172a" stroke="#fde047" stroke-width="1.5" />
      <text x="29" y="34" fill="#fde047" font-size="14" font-weight="900" text-anchor="middle">[  ]</text>
      <text x="54" y="32" fill="#FEF08A" font-size="11" font-weight="800">DOLOR D: TEMOR A ALUCINACIÓN EN IA</text>
      <text x="15" y="58" fill="#CBD5E1" font-size="9.5">• Desconfianza en sistemas digitales que "inventan" normas.</text>
      <text x="15" y="74" fill="#CBD5E1" font-size="9.5">• Falta de citas verificables con Gaceta Oficial o articulado COPP.</text>
      <text x="15" y="90" fill="#CBD5E1" font-size="9.5">• Preocupación por vulnerar la privacidad del expediente.</text>
      <text x="15" y="118" fill="#FDE047" font-size="9.5" font-weight="700">Impacto: Resistencia al cambio tecnológico en la magistratura.</text>
    </g>
  </g>


  <!-- SECTION 3: REQUERIMIENTOS Y GARANTÍAS DE CONFIANZA (PREGUNTAS ABIERTAS) -->
  <text x="40" y="730" fill="#38BDF8" font-size="13" font-weight="800" letter-spacing="1">SECCIÓN C: REQUERIMIENTOS CUALITATIVOS DE CONFIANZA Y CONDICIONES DE ADOPCIÓN</text>

  <g transform="translate(40, 745)">
    <rect x="0" y="0" width="1840" height="295" rx="12" fill="url(#gradCardDark)" stroke="#10B981" stroke-width="1.5" filter="url(#shadow)" />
    <rect x="0" y="0" width="1840" height="34" rx="12" fill="#047857" />
    <text x="20" y="22" fill="#FFFFFF" font-size="12" font-weight="800">ENTREVISTA CUALITATIVA / REQUERIMIENTOS CLAVE DE ASISTENCIA JUDICIAL INTEGRA</text>

    <!-- Field 1 -->
    <g transform="translate(20, 48)">
      <rect x="0" y="0" width="890" height="108" rx="8" fill="#022c22" stroke="#10b981" stroke-width="1" />
      <text x="15" y="22" fill="#6EE7B7" font-size="11" font-weight="800">1. ¿Qué garantía técnica o jurídica exige usted para confiar en una recomendación generada por IA?</text>
      <text x="15" y="40" fill="#94A3B8" font-size="10">(Ej. Citas exactas en Gaceta Oficial, Semáforo Verde de anclaje, Auditoría de Hash SHA-256, Visor dual del PDF original)</text>
      
      <!-- User input lines simulation -->
      <line x1="15" y1="62" x2="875" y2="62" stroke="#1e293b" stroke-dasharray="4,4" />
      <line x1="15" y1="84" x2="875" y2="84" stroke="#1e293b" stroke-dasharray="4,4" />
      <text x="20" y="78" fill="#64748B" font-size="10" font-style="italic">Escriba aquí sus requisitos de validez jurídica...</text>
    </g>

    <!-- Field 2 -->
    <g transform="translate(930, 48)">
      <rect x="0" y="0" width="890" height="108" rx="8" fill="#022c22" stroke="#10b981" stroke-width="1" />
      <text x="15" y="22" fill="#6EE7B7" font-size="11" font-weight="800">2. Si el sistema pre-evalúa el expediente en &lt; 5 min con error cero, ¿cuál sería el impacto en su despacho?</text>
      <text x="15" y="40" fill="#94A3B8" font-size="10">(Estimación de audiencias por día, reducción de retardo procesal, descongestionamiento de retenes policiales)</text>

      <!-- User input lines simulation -->
      <line x1="15" y1="62" x2="875" y2="62" stroke="#1e293b" stroke-dasharray="4,4" />
      <line x1="15" y1="84" x2="875" y2="84" stroke="#1e293b" stroke-dasharray="4,4" />
      <text x="20" y="78" fill="#64748B" font-size="10" font-style="italic">Describa la mejora esperada en el flujo de trabajo...</text>
    </g>

    <!-- Field 3 (Bottom Full Width) -->
    <g transform="translate(20, 168)">
      <rect x="0" y="0" width="1800" height="112" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="15" y="22" fill="#38BDF8" font-size="11" font-weight="800">3. Observaciones, riesgos percibidos o sugerencias de diseño para la interfaz del Panel de Control Visual (app.py):</text>
      <text x="15" y="40" fill="#94A3B8" font-size="10">(Aspectos de accesibilidad, legibilidad de colores HSL, velocidad de búsqueda, interacción en plena audiencia oral)</text>

      <line x1="15" y1="64" x2="1785" y2="64" stroke="#1e293b" stroke-dasharray="4,4" />
      <line x1="15" y1="88" x2="1785" y2="88" stroke="#1e293b" stroke-dasharray="4,4" />
      <text x="20" y="80" fill="#64748B" font-size="10" font-style="italic">Espacio libre para recomendaciones del operador de justicia...</text>
    </g>
  </g>

  <!-- FOOTER -->
  <rect x="0" y="1055" width="1920" height="25" fill="#090d16" />
  <line x1="0" y1="1055" x2="1920" y2="1055" stroke="#1e293b" stroke-width="1" />
  <text x="40" y="1072" fill="#64748B" font-size="11" font-weight="500">JullBrain Legal-RAG — Instrumento 1: Cuestionario de Empatía &amp; Diagnóstico de Carga Operativa (Design Thinking IBM)</text>
  <text x="1880" y="1072" fill="#64748B" font-size="11" font-weight="500" text-anchor="end">Fase 01: Comprender &amp; Empatizar | ISO 29148 &amp; ISO 9241-210</text>

</svg>
